# Prefix: C-Space (primary), F1 (secondary), C-b removed
set -g prefix C-Space
set -g prefix2 F1
unbind C-b
bind C-Space send-prefix
bind F1 send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing (repeatable)
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Pane borders at bottom showing pane info
set -g pane-border-status bottom
set -g pane-border-format "#P: #{pane_current_command}"

# Vi mode for copy mode
set -g mode-keys vi
bind -T copy-mode-vi Escape send-keys -X cancel


# Layouts: = cycles layouts; 1-9 stay as select-window (default)
bind = next-layout

# Dev layout 1: popups over nvim              
# Open tools as popup windows in the current pane's directory.
# Main pane runs nvim; g/p/b summon lazygit/pi/btop on top of it.
# Only ONE popup per client: these close the current popup first (-C),
# then open the requested one. prefix+q closes a popup, returning input
# to the pane underneath (popups always steal keyboard focus by design).
bind g display-popup -C \; display-popup -d "#{pane_current_path}" -w 90% -h 90% -E lazygit
bind p display-popup -C \; display-popup -d "#{pane_current_path}" -w 90% -h 90% -E pi
bind b display-popup -C \; display-popup -d "#{pane_current_path}" -w 60% -h 60% -E btop
bind q display-popup -C

# Status bar configuration
set -g status-position top
set -g status-justify left
set -g status-style 'bg=#1d2021 fg=#c2c2c2'
set -g status-interval 5

# Left status: session with prefix color indicator
set -g status-left '#{?client_prefix,#[bg=#7d9aa3]#[fg=#141415,bold],#[bg=#1d2021]#[fg=#7d7d7d]} #S '
set -g status-left-length 20

# Right status: directory + git branch + time + date
set -g status-right '#[fg=#333738]#[bg=#252530,fg=#7d7d7d] #{=-20:#{?#{==:#{pane_current_path},$HOME},~,#{b:pane_current_path}}} #[fg=#333738]#[bg=#252530,fg=#7d7d7d] #{=-15:#(cd #{pane_current_path}; git branch 2>/dev/null | grep "^\*" | cut -c3- || echo "")} #[fg=#333738]#[bg=#252530,fg=#c2c2c2,bold] %H:%M #[fg=#333738]#[bg=#252530,fg=#c2c2c2] %a %d %b '
set -g status-right-length 80

# Window status format with color separator between number and title
setw -g window-status-current-style 'fg=#141415 bg=#7d9aa3 bold'
setw -g window-status-current-format ' #I:#W#{?window_zoomed_flag,🔍,}#{?window_bell_flag,🔔,}#{?window_activity_flag,●, }'

# Last window gets a muted slate tint instead of dash
setw -g window-status-last-style 'fg=#74809c bg=#1d2021'
setw -g window-status-style 'fg=#7d7d7d bg=#1d2021'
setw -g window-status-format ' #I:#W#[fg=#7d7d7d]#{?window_zoomed_flag,🔍,}#[fg=#a06a74]#{?window_bell_flag,🔔,}#{?window_activity_flag,●, }'

# Window activity monitoring
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style 'fg=#a06a74,bg=#1d2021'

# Pane border colors and status
set -g pane-border-style 'fg=#333738'
set -g pane-active-border-style 'fg=#7d9aa3,bold'
set -g pane-border-format ' #P: #{pane_current_command} '

# Message styling
set -g message-style 'bg=#252530 fg=#c2c2c2 bold'
set -g message-command-style 'bg=#333738 fg=#c2c2c2 bold'



 set -g set-clipboard on

# Copy mode bindings (tmux-yank plugin handles clipboard yank/paste via wl-copy)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle


# Split panes using current pane's directory (most common use case)
bind '"' split-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind 'c' new-window -c "#{pane_current_path}"

# Override for specific directory splits
bind 'C' command-prompt -p "Directory for new pane:" "split-window -c '%%'"

# Enable mouse support for scrolling and pane selection
set -g mouse on
set -g extended-keys on
